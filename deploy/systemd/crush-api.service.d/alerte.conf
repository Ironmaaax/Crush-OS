# Drop-in — branche l'alerte de panne sur crush-api.
#
# Un drop-in plutôt qu'une modification de l'unité : `crush-api.service.d/`
# contient déjà `docker-rootless.conf` (DOCKER_HOST du démon rootless).
# Réécrire l'unité principale risquerait d'orpheliner ce dossier — c'est
# exactement ce qui a fait disparaître DOCKER_HOST lors du renommage du projet,
# sans une seule erreur au journal.
[Unit]
OnFailure=crush-alerte@%n.service
