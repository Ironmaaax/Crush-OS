name: Build Windows offline bundle

# Sur push d'un tag vX.Y.Z : build le bundle offline Windows (snapshot figé du
# code au tag), zippe le PROJET + bundle/ dans un dossier-chapeau crush-OS/,
# crée la release et y attache crush-offline-windows-<tag>.zip.
on:
  push:
    tags:
      - "v*"
  # Déclenchement manuel : valider le build SANS publier. Sans ça, la seule façon
  # d'éprouver ce workflow était de pousser un tag, donc de brûler un numéro de
  # version à chaque tentative — et un tag qui échoue laisse une version sans
  # release, ce qui est pire qu'inutile. Ici, aucune release n'est créée : voir la
  # condition sur l'étape « Créer la release ».
  workflow_dispatch:

permissions:
  contents: write # créer la release + uploader l'asset

jobs:
  build:
    # IMPÉRATIF : bundle Windows (Python portable Windows + binaires natifs +
    # livekit-server.exe). Ne se build PAS sur Ubuntu.
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout (au tag)
        uses: actions/checkout@v4

      # uv géré comme dans ci.yml (cache intégré). Le script sait aussi
      # auto-installer uv, mais on le fige ici pour la fiabilité CI.
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      # Script de build EXISTANT, inchangé sauf l'appel API livekit authentifié.
      # GITHUB_TOKEN : évite le rate-limit anonyme (60/h) sur les IP partagées des
      # runners, au moment précis (release) où on ne veut pas découvrir un échec.
      - name: Build offline bundle
        shell: pwsh
        # La sortie du script est aussi remontée en `::error::` quand il tombe :
        # les annotations d'un run sont lisibles sans droits admin sur le dépôt,
        # les logs non. Sans ça, un échec de build ne dit rien d'autre que
        # « exit code 1 » — au moment précis d'une release, c'est le pire endroit
        # pour n'avoir aucun diagnostic.
        run: |
          $ErrorActionPreference = "Stop"
          $journal = "build_bundle.log"
          try {
            & .\scripts\release\build_bundle.ps1 *>&1 | Tee-Object -FilePath $journal
          } catch {
            ($_ | Out-String) | Tee-Object -FilePath $journal -Append | Out-Host
            if (Test-Path $journal) {
              # UNE seule annotation multi-lignes, pas quarante : GitHub tronque
              # au-delà d'un certain nombre d'annotations, et il garde les
              # PREMIÈRES — on perdrait donc la fin, qui est justement la cause.
              # `%0A` est le saut de ligne des commandes de workflow ; `%` doit
              # être échappé avant, sinon un pourcentage du log casse l'encodage.
              $queue = (Get-Content $journal -Tail 25) -join "`n"
              $msg = $queue -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
              Write-Host "::error title=build_bundle (25 dernieres lignes)::$msg"
            }
            exit 1
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Vérif PAR CHEMIN de chaque brique critique dans bundle/ AVANT de zipper.
      # Attrape la perte partielle (ex. livekit-server.exe manquant) que le seul
      # contrôle de taille raterait (bundle encore ~650 MB sans lui).
      - name: Vérifier que le bundle est complet
        shell: pwsh
        run: |
          $required = @(
            "bundle\manifest.json",
            "bundle\python\python.exe",
            "bundle\.venv\Scripts\python.exe",
            "bundle\bin\uv.exe",
            "bundle\bin\livekit-server.exe",
            "bundle\models\yolov8n.pt",
            "bundle\models\piper\fr_FR-upmc-medium.onnx",
            "bundle\models\piper\fr_FR-upmc-medium.onnx.json"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Host "::error::Bundle incomplet — manquants : $($missing -join ', ')"
            exit 1
          }
          Write-Host "Bundle complet (toutes les briques présentes)."

      # Packaging déterministe :
      #  - allowlist = fichiers SUIVIS par git (source propre) via `git archive` :
      #    exclut automatiquement .venv racine, __pycache__, *.egg-info, .pytest_cache
      #    (tous gitignorés) → zip reproductible, zéro bruit de build.
      #  - + bundle/ (gitignoré, buildé à l'étape précédente).
      #  - dossier-chapeau crush-OS/ (cohérent avec README : `cd crush-OS`).
      - name: Packager le zip
        shell: pwsh
        run: |
          # Sur déclenchement manuel, `github.ref_name` est un nom de BRANCHE : on
          # ne veut ni un « crush-offline-windows-main.zip », ni une release
          # nommée « main ». Le build est alors étiqueté comme provisoire.
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "dev-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          $zip = "crush-offline-windows-$tag.zip"
          $top = "crush-OS"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          if (Test-Path $top) { Remove-Item $top -Recurse -Force }

          git archive --format=zip -o _src.zip HEAD
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::git archive a échoué"; exit 1 }
          Expand-Archive -Path _src.zip -DestinationPath $top -Force
          Remove-Item _src.zip -Force
          Move-Item -Path bundle -Destination (Join-Path $top "bundle")

          Compress-Archive -Path $top -DestinationPath $zip -CompressionLevel Optimal
          $sizeMB = [math]::Round((Get-Item $zip).Length / 1MB)
          Write-Host "Zip produit : $zip ($sizeMB MB)"
          # Ceinture-bretelles par-dessus la vérif par chemin : un vrai bundle pèse ~700 MB.
          if ($sizeMB -lt 300) {
            Write-Host "::error::Zip trop petit ($sizeMB MB) — build probablement incomplet."
            exit 1
          }
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Vérif POST-zip : les briques critiques sont bien DANS l'archive (au bon
      # chemin chapeau). Attrape un éventuel raté de packaging. Imprime aussi la
      # structure pour validation.
      - name: Vérifier le contenu de l'archive
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $env:ZIP_PATH))
          $entries = $archive.Entries | ForEach-Object { $_.FullName -replace '\\','/' }
          $count = $archive.Entries.Count
          $archive.Dispose()
          $critical = @(
            "crush-OS/bundle/manifest.json",
            "crush-OS/bundle/python/python.exe",
            "crush-OS/bundle/.venv/Scripts/python.exe",
            "crush-OS/bundle/bin/uv.exe",
            "crush-OS/bundle/bin/livekit-server.exe",
            "crush-OS/bundle/models/yolov8n.pt",
            "crush-OS/bundle/models/piper/fr_FR-upmc-medium.onnx",
            "crush-OS/bundle/models/piper/fr_FR-upmc-medium.onnx.json",
            "crush-OS/src/crush/app.py",
            "crush-OS/crush.ps1",
            "crush-OS/setup.bat",
            "crush-OS/pyproject.toml"
          )
          $missing = $critical | Where-Object { $entries -notcontains $_ }
          if ($missing) {
            Write-Host "::error::Briques critiques absentes de l'archive : $($missing -join ', ')"
            exit 1
          }
          # Garde-fou anti-bruit : aucun .venv racine ne doit avoir fui dans le zip.
          $leaked = $entries | Where-Object { $_ -like "crush-OS/.venv/*" }
          if ($leaked) {
            Write-Host "::error::Un .venv racine a fui dans l'archive ($($leaked.Count) entrées)."
            exit 1
          }
          Write-Host "Archive OK — $count entrées, dossier-chapeau crush-OS/, briques critiques présentes, pas de .venv racine."

      # Empreinte de l'archive RÉELLEMENT publiée. Compress-Archive n'est pas
      # déterministe au bit près d'un run à l'autre : l'empreinte ne peut donc pas
      # être connue avant le build, elle doit être relevée ici. Elle est publiée en
      # sidecar pour que `scripts/pin_bundle.py` puisse l'épingler dans le code sans
      # avoir à retélécharger 700 MB.
      - name: Empreinte SHA-256 de l'archive
        shell: pwsh
        run: |
          $zip = $env:ZIP_PATH
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          $bytes = (Get-Item $zip).Length
          "$hash  $(Split-Path $zip -Leaf)" | Out-File -FilePath "$zip.sha256" -Encoding ascii
          "SHA256_FILE=$zip.sha256" | Out-File -FilePath $env:GITHUB_ENV -Append

          # Résumé de job : de quoi épingler à la main si besoin. Construit ligne
          # par ligne plutôt qu'en here-string — l'imbrication d'un `if` dans un
          # here-string ne s'évalue pas, elle s'y insère en texte.
          $nomZip = Split-Path $zip -Leaf
          $lignes = @(
            "## Bundle produit",
            "",
            "| | |",
            "|---|---|",
            "| Archive | ``$nomZip`` |",
            "| Taille exacte | ``$bytes`` octets |",
            "| SHA-256 | ``$hash`` |",
            ""
          )
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $lignes += "Pour épingler ces valeurs : ``python scripts/pin_bundle.py $($env:GITHUB_REF_NAME)``"
          } else {
            $lignes += "Build de **validation** (déclenchement manuel) : aucune release créée, donc rien à épingler — ``pin_bundle.py`` lit une release par son tag."
          }
          ($lignes -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "SHA-256 : $hash"
          Write-Host "Octets  : $bytes"

      # Publier n'a de sens que sur un tag. Un déclenchement manuel sert à
      # éprouver le build : il s'arrête ici, sans rien rendre public.
      - name: Créer la release + attacher le zip
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true # CHANGELOG indexé par phase, pas par version
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.SHA256_FILE }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
