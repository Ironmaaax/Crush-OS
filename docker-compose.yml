services:
  crush:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crush-os
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Données persistantes (mémoire, sessions, skills) — survivent aux rebuilds
      - crush-data:/app/memory_data
      - crush-skills:/app/skills_data
      - crush-workspace:/app/workspace
      # Modèle TTS Piper, téléchargé manuellement (hors image)
      - ./models:/app/models:ro
      - ./config:/app/config
      - ./.env:/app/.env
    networks:
      - crush-net

networks:
  crush-net:
    driver: bridge

volumes:
  crush-data:
  crush-skills:
  crush-workspace:
